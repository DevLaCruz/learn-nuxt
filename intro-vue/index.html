<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="myApp">
        <h1>Batman {{ totalQuotes }} quotes</h1>

        <input type="text" placeholder="Add Quote" @keypress.enter="addQuote" v-model="newMessage">
        <button @click="toggleAuthor">
            ver author
        </button>

        <button @click="addQuote">Add quote</button>

        <hr>

        <ul>
            <li v-for="({quote, author}, index) in quotes">
                <span>{{ index + 1 }} - {{ quote }}</span>
                <blockquote v-if="showAuthor">{{ author }}</blockquote>
            </li>
        </ul>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="app.js"></script>
</body>
</html>
